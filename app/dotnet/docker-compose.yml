# Local PostgreSQL for developing/testing the modernized CardDemo batch programs.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: carddemo-pg
    environment:
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: carddemo
      POSTGRES_DB: carddemo
    ports:
      - "5432:5432"
    volumes:
      - carddemo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carddemo -d carddemo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  carddemo-pgdata:
