openapi: 3.1.0
info:
  title: CardDemo Card Service API
  description: |
    REST API for Credit Card management, migrated from COBOL CardDemo mainframe programs.

    **COBOL Programs Ported:**
    - COCRDLIC.cbl — Credit Card List (Transaction CCLI)
    - COCRDSLC.cbl — Credit Card Detail View (Transaction CCDL)
    - COCRDUPC.cbl — Credit Card Update (Transaction CCUP)

    **VSAM File:** CARDDAT (KSDS, primary key = CARD-NUM, copybook CVACT02Y.cpy)

    **Strangler-Fig Migration Phase 4** — Card Service
  version: 1.0.0
  contact:
    name: CardDemo Migration Team

servers:
  - url: http://localhost:18089
    description: Local development server

paths:
  /api/v1/cards:
    get:
      tags:
        - Card Management
      summary: List credit cards with pagination
      description: |
        Returns a paginated list of credit cards. Optionally filter by account ID.
        Replaces COCRDLIC.cbl CICS browse (STARTBR/READNEXT/READPREV on CARDDAT).
        PF7 (page up) / PF8 (page down) replaced by page parameter.
      operationId: listCards
      parameters:
        - name: accountId
          in: query
          required: false
          description: Filter cards by 11-digit account ID
          schema:
            type: integer
            format: int64
            example: 00000000001
        - name: page
          in: query
          required: false
          description: Page number (0-based)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: Page size
          schema:
            type: integer
            default: 10
        - name: sort
          in: query
          required: false
          description: Sort field and direction (e.g., cardNumber,asc)
          schema:
            type: string
            default: cardNumber,asc
      responses:
        '200':
          description: Cards retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCardResponse'

  /api/v1/cards/{cardNumber}:
    get:
      tags:
        - Card Management
      summary: View card details
      description: |
        Retrieves detailed card information including linked account ID.
        Replaces COCRDSLC.cbl (EXEC CICS READ DATASET('CARDDAT')).
      operationId: getCard
      parameters:
        - name: cardNumber
          in: path
          required: true
          description: 16-character card number
          schema:
            type: string
            example: '4111111111111111'
      responses:
        '200':
          description: Card found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '404':
          description: Card not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Card Management
      summary: Update card details
      description: |
        Updates editable card fields (embossed name, expiration date, active status).
        Card number is immutable (primary key).
        Replaces COCRDUPC.cbl (EXEC CICS READ UPDATE + REWRITE on CARDDAT).
      operationId: updateCard
      parameters:
        - name: cardNumber
          in: path
          required: true
          description: 16-character card number
          schema:
            type: string
            example: '4111111111111111'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardUpdateRequest'
      responses:
        '200':
          description: Card updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400':
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Card not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Concurrent modification conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CardResponse:
      type: object
      description: Card detail representation matching CVACT02Y.cpy CARD-RECORD fields
      properties:
        cardNumber:
          type: string
          description: "PIC X(16) — CARD-NUM (primary key, immutable)"
          example: '4111111111111111'
        accountId:
          type: integer
          format: int64
          description: "PIC 9(11) — CARD-ACCT-ID (linked account)"
          example: 1
        cvvCode:
          type: integer
          description: "PIC 9(03) — CARD-CVV-CD"
          example: 123
        embossedName:
          type: string
          description: "PIC X(50) — CARD-EMBOSSED-NAME"
          example: 'JOHN DOE'
        expirationDate:
          type: string
          description: "PIC X(10) — CARD-EXPIRAION-DATE (MM-DD-YYYY)"
          example: '12-31-2026'
        activeStatus:
          type: string
          description: "PIC X(01) — CARD-ACTIVE-STATUS (Y=active, N=inactive)"
          example: 'Y'
      required:
        - cardNumber
        - accountId
        - cvvCode
        - activeStatus

    CardUpdateRequest:
      type: object
      description: Updatable card fields from COCRDUPC.cbl
      properties:
        embossedName:
          type: string
          maxLength: 50
          description: New embossed name (max 50 chars)
          example: 'JOHN A DOE'
        expirationDate:
          type: string
          pattern: '^\d{2}-\d{2}-\d{4}$'
          description: New expiration date in MM-DD-YYYY format
          example: '12-31-2027'
        activeStatus:
          type: string
          enum: ['Y', 'N']
          description: Card active status
          example: 'Y'

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 404
        message:
          type: string
          description: Error description
          example: 'Card not found: 0000000000000000'
        errors:
          type: array
          items:
            type: string
          description: Individual validation error messages
        timestamp:
          type: string
          format: date-time
          description: Error occurrence timestamp

    PagedCardResponse:
      type: object
      description: Spring Data Page wrapper for card list
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CardResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
