version: '3.8'

services:
  # PostgreSQL Database
  # Replaces USRSEC VSAM file for user data storage
  postgres:
    image: postgres:15-alpine
    container_name: carddemo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carddemo}
      POSTGRES_USER: ${POSTGRES_USER:-carddemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carddemo -d carddemo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carddemo-network

  # Authentication Service
  # Replaces COSGN00C (CC00 transaction)
  authentication-service:
    build:
      context: ./authentication-service
      dockerfile: Dockerfile
    container_name: carddemo-auth
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-carddemo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-carddemo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - carddemo-network

  # User Management Service
  # Replaces COUSR00C, COUSR01C, COUSR02C, COUSR03C
  user-management-service:
    build:
      context: ./user-management-service
      dockerfile: Dockerfile
    container_name: carddemo-user
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-carddemo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-carddemo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - carddemo-network

  # API Gateway
  # Implements Strangler Fig Pattern for gradual migration
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: carddemo-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      - authentication-service
      - user-management-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - carddemo-network

volumes:
  postgres_data:
    driver: local

networks:
  carddemo-network:
    driver: bridge
