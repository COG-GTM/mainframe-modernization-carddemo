# CardDemo Batch Transaction Posting - Application Configuration
spring.application.name=cardemo-batch

# PostgreSQL Configuration (production)
spring.datasource.url=jdbc:postgresql://localhost:5432/cardemo
spring.datasource.username=cardemo
spring.datasource.password=cardemo
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=true

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.export.prometheus.enabled=true

# Logging
logging.level.com.cardemo.batch=INFO
logging.level.org.springframework.batch=INFO
