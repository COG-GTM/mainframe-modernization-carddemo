# ==========================================================================
# CardDemo Transaction Service - Application Configuration
#
# This Spring Boot service replaces the CICS COBOL program COTRN02C
# which adds transactions to the TRANSACT VSAM file.
# ==========================================================================

spring.application.name=transaction-service

# --------------------------------------------------------------------------
# Database Configuration
# Default: H2 in-memory for development/testing
# For production, switch to PostgreSQL or Aurora
# --------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway database migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# H2 Console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --------------------------------------------------------------------------
# Server Configuration
# --------------------------------------------------------------------------
server.port=8080

