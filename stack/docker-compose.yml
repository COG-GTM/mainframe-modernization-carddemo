# Local DB2 for the Bill Payment stream (matches application-db2.yml defaults).
# Start:  docker compose -f stack/docker-compose.yml up -d
# The database takes ~2-3 minutes to finish first-time setup.
services:
  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    container_name: carddemo-db2
    privileged: true
    ports:
      - "50000:50000"
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: carddemo123
      DBNAME: CARDDEMO
    volumes:
      - carddemo-db2-data:/database

volumes:
  carddemo-db2-data:
