spring:
  application:
    name: carddemo
  datasource:
    url: jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

server:
  port: 8080

carddemo:
  data:
    # Sample VSAM extracts shipped with the COBOL application (app/data/ASCII).
    directory: ../app/data/ASCII
    load-on-startup: true

logging:
  level:
    com.carddemo: INFO
