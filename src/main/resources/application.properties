spring.application.name=carddemo-statement-generation

# PostgreSQL datasource - configure via environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carddemo}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Statement output
statement.output.directory=./output
