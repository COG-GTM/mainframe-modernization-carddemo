# ===================================================================
# Test Configuration — H2 in-memory database
# ===================================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# Disable scheduling in tests
cardemo.batch.schedule.enabled=false

# Test output directory
cardemo.batch.output.dir=${java.io.tmpdir}/cardemo-test-output

# Logging
logging.level.com.cardemo.batch.orchestration=DEBUG
logging.level.org.springframework.batch=INFO
