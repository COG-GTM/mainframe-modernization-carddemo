[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oe129bc"
version = "0.1.0"
description = "Python/FastAPI port of OE129BC COBOL validation program"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["oe129bc"]

[tool.coverage.report]
fail_under = 80
show_missing = true
