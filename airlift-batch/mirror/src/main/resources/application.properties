spring.main.banner-mode=off
spring.application.name=airlift-batch-mirror

# The clusters and the Spring Batch metadata share one embedded database, created
# fresh for every run: a rerun of the job chain must start from the fixtures.
spring.datasource.url=jdbc:h2:mem:airlift;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=true

# The DD statements. Overridden on the command line by scripts/run-java.sh.
airlift.copybook-dir=../../app/cpy
airlift.in=../build/fixtures
airlift.out=../build/java
# The value the COBOL harness is given through AIRLIFT_CLOCK, and the PARM= INTCALC
# passes to CBACT04C.
airlift.clock=2022071810300012+0000
airlift.parm-date=2022071800

logging.level.org.springframework.batch=WARN
logging.level.root=WARN
