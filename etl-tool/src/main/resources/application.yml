# CardDemo EBCDIC ETL Migration Tool - Default Configuration
# Override via environment variables or command-line arguments

spring:
  application:
    name: carddemo-etl-tool

  # PostgreSQL configuration (primary target)
  datasource:
    url: jdbc:postgresql://localhost:5432/carddemo
    username: carddemo
    password: carddemo
    driver-class-name: org.postgresql.Driver

  # Flyway schema migration
  flyway:
    enabled: true
    locations: classpath:db/migration

# ETL-specific configuration
etl:
  # Path to the directory containing EBCDIC data files
  source-dir: app/data/EBCDIC
  # JDBC batch size for inserts
  batch-size: 100
  # Truncate all tables before loading (idempotent re-run)
  truncate-before-load: true
  # Validate cross-reference integrity after loading
  validate-xref: true

logging:
  level:
    com.carddemo.etl: INFO
    org.springframework.jdbc: WARN
