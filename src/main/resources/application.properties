# Interest Calculation Batch Service
# Ported from COBOL program CBACT04C.cbl
spring.application.name=carddemo-interest-batch

# PostgreSQL datasource (production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carddemo}
spring.datasource.username=${DB_USERNAME:carddemo}
spring.datasource.password=${DB_PASSWORD:carddemo}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Interest calculation configuration
interest.calculation.run-date=${PARM_DATE:}

# Actuator metrics
management.endpoints.web.exposure.include=health,metrics,info
