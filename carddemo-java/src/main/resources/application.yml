spring:
  application:
    name: carddemo-java

  # Default profile: H2 in-memory database for development
  datasource:
    url: jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

---
# Production profile: PostgreSQL
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carddemo}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:carddemo}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

---
# Seed profile: loads seed data at startup
spring:
  config:
    activate:
      on-profile: seed

  flyway:
    locations: classpath:db/migration
