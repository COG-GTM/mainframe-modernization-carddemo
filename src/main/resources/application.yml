spring:
  application:
    name: carddemo-migration-validation
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

migration:
  ebcdic:
    data-dir: app/data/EBCDIC
  validation:
    spot-check-count: 3
