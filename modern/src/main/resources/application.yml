# =============================================================================
# CardDemo Modern Application Configuration
# =============================================================================
# Replaces mainframe CICS system definitions and JCL parameters.
# =============================================================================

spring:
  application:
    name: carddemo-modern
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api/v1

# --- Management / Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# --- Menu Configuration (from COMEN02Y.cpy and COADM02Y.cpy) ---
carddemo:
  menu:
    user-menu:
      - option: 1
        label: "Account View"
        program: "COACTVWC"
        route: "/accounts/view"
      - option: 2
        label: "Account Update"
        program: "COACTUPC"
        route: "/accounts/update"
      - option: 3
        label: "Credit Card List"
        program: "COCRDLIC"
        route: "/cards"
      - option: 4
        label: "Credit Card View"
        program: "COCRDSLC"
        route: "/cards/view"
      - option: 5
        label: "Credit Card Update"
        program: "COCRDUPC"
        route: "/cards/update"
      - option: 6
        label: "Transaction List"
        program: "COTRN00C"
        route: "/transactions"
      - option: 7
        label: "Transaction View"
        program: "COTRN01C"
        route: "/transactions/view"
      - option: 8
        label: "Transaction Add"
        program: "COTRN02C"
        route: "/transactions/add"
      - option: 9
        label: "Transaction Reports"
        program: "CORPT00C"
        route: "/reports/transactions"
      - option: 10
        label: "Bill Payment"
        program: "COBIL00C"
        route: "/payments/bill"
    admin-menu:
      - option: 1
        label: "User List (Security)"
        program: "COUSR00C"
        route: "/admin/users"
      - option: 2
        label: "User Add (Security)"
        program: "COUSR01C"
        route: "/admin/users/add"
      - option: 3
        label: "User Update (Security)"
        program: "COUSR02C"
        route: "/admin/users/update"
      - option: 4
        label: "User Delete (Security)"
        program: "COUSR03C"
        route: "/admin/users/delete"

---
# =============================================================================
# Development Profile
# =============================================================================
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.carddemo: DEBUG

---
# =============================================================================
# Test Profile
# =============================================================================
spring:
  config:
    activate:
      on-profile: test

logging:
  level:
    com.carddemo: DEBUG
    root: WARN

---
# =============================================================================
# Production Profile
# =============================================================================
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    com.carddemo: INFO
    root: WARN

management:
  endpoint:
    health:
      show-details: never
