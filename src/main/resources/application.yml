spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cardemo
    username: cardemo
    password: cardemo
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: true

# Transaction detail report configuration
report:
  page-size: 20
  record-length: 133
  output-path: ./output/transaction-detail-report.txt

# Date parameters (can be overridden via command line)
dateparm:
  start-date: "2022-01-01"
  end-date: "2022-12-31"

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  batch:
    jdbc:
      initialize-schema: embedded
    job:
      enabled: false
