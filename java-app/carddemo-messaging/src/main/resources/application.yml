spring:
  application:
    name: carddemo-messaging
  datasource:
    url: jdbc:postgresql://localhost:5432/carddemo
    username: carddemo
    password: carddemo
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin

server:
  port: 8082

logging:
  level:
    com.carddemo: INFO

carddemo:
  jms:
    account-query-queue: account.query
