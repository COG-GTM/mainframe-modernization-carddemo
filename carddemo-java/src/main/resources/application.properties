# CardDemo Java 17 Migration - Application Configuration
spring.application.name=carddemo

# Database Configuration (H2 for dev/test, PostgreSQL for production)
spring.datasource.url=jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Spring Batch Configuration
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# JMS / ActiveMQ Configuration
spring.activemq.broker-url=vm://embedded?broker.persistent=false
spring.activemq.in-memory=true
carddemo.mq.request-queue=AWS.M2.CARDDEMO.PAUTH.REQUEST
carddemo.mq.reply-queue=AWS.M2.CARDDEMO.PAUTH.REPLY
carddemo.mq.batch-size=500

# JWT Configuration
carddemo.jwt.secret=CardDemoSecretKeyForJWTTokenGenerationMustBeLongEnough256Bits!!
carddemo.jwt.expiration-ms=3600000

# Server Configuration
server.port=8080

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.carddemo=INFO
logging.level.org.springframework.batch=INFO
