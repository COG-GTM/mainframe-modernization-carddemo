spring:
  application:
    name: carddemo-migration-validation-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

migration:
  ebcdic:
    data-dir: src/test/resources/testdata
  validation:
    spot-check-count: 3
