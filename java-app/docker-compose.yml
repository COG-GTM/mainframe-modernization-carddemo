version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carddemo
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: carddemo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  activemq:
    image: apache/activemq-classic:6.1.0
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      ACTIVEMQ_USERNAME: admin
      ACTIVEMQ_PASSWORD: admin

  carddemo-online:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/carddemo
      SPRING_DATASOURCE_USERNAME: carddemo
      SPRING_DATASOURCE_PASSWORD: carddemo
      SPRING_PROFILES_ACTIVE: seed
      CARDDEMO_SEED_DATA_PATH: /app/data
    depends_on:
      - postgres
      - activemq

volumes:
  pgdata:
