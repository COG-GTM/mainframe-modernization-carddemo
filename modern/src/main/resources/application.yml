spring:
  application:
    name: carddemo-auth

  profiles:
    active: dev

  jpa:
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits}
    expiration-ms: 86400000  # 24 hours
