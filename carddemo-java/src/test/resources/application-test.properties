spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
spring.activemq.broker-url=vm://embedded?broker.persistent=false
spring.activemq.in-memory=true
carddemo.mq.request-queue=TEST.REQUEST
carddemo.mq.reply-queue=TEST.REPLY
carddemo.mq.batch-size=500
carddemo.jwt.secret=TestSecretKeyForJWTTokenGenerationMustBeLongEnough256Bits!!
carddemo.jwt.expiration-ms=3600000
