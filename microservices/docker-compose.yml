version: '3.8'

services:
  # ============================================================
  # Infrastructure Services
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: carddemo-postgres
    environment:
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: carddemo
      POSTGRES_DB: carddemo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carddemo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carddemo-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: carddemo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carddemo-net

  # ============================================================
  # Shared Library (build only - used as Maven dependency)
  # ============================================================
  shared-lib-build:
    image: maven:3.9-eclipse-temurin-21-alpine
    container_name: carddemo-shared-lib-build
    working_dir: /app
    volumes:
      - ./shared-lib:/app
      - maven-cache:/root/.m2
    command: mvn clean install -DskipTests -q
    networks:
      - carddemo-net

  # ============================================================
  # Application Services
  # ============================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: carddemo-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/carddemo_auth
      SPRING_DATASOURCE_USERNAME: carddemo
      SPRING_DATASOURCE_PASSWORD: carddemo
      JWT_SECRET: carddemo-jwt-secret-for-development-only
      JWT_EXPIRATION: 86400000
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - carddemo-net

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: carddemo-account-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/carddemo_accounts
      SPRING_DATASOURCE_USERNAME: carddemo
      SPRING_DATASOURCE_PASSWORD: carddemo
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      CARDDEMO_CARD_SERVICE_URL: http://card-service:8080
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - carddemo-net

  card-service:
    build:
      context: ./card-service
      dockerfile: Dockerfile
    container_name: carddemo-card-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/carddemo_cards
      SPRING_DATASOURCE_USERNAME: carddemo
      SPRING_DATASOURCE_PASSWORD: carddemo
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - carddemo-net

  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    container_name: carddemo-transaction-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/carddemo_transactions
      SPRING_DATASOURCE_USERNAME: carddemo
      SPRING_DATASOURCE_PASSWORD: carddemo
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - carddemo-net

  statement-service:
    build:
      context: ./statement-service
      dockerfile: Dockerfile
    container_name: carddemo-statement-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ACCOUNT_SERVICE_URL: http://account-service:8080
      CARD_SERVICE_URL: http://card-service:8080
      TRANSACTION_SERVICE_URL: http://transaction-service:8080
    ports:
      - "8085:8080"
    depends_on:
      account-service:
        condition: service_healthy
      card-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - carddemo-net

  user-admin-service:
    build:
      context: ./user-admin-service
      dockerfile: Dockerfile
    container_name: carddemo-user-admin-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_users
      DB_USERNAME: carddemo
      DB_PASSWORD: carddemo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/carddemo_users
      SPRING_DATASOURCE_USERNAME: carddemo
      SPRING_DATASOURCE_PASSWORD: carddemo
    ports:
      - "8086:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - carddemo-net

  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    container_name: carddemo-billing-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      ACCOUNT_SERVICE_URL: http://account-service:8080
      CARD_SERVICE_URL: http://card-service:8080
      TRANSACTION_SERVICE_URL: http://transaction-service:8080
    ports:
      - "8087:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - carddemo-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: carddemo-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: carddemo-jwt-secret-for-development-only
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      card-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      user-admin-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - carddemo-net

volumes:
  postgres-data:
  maven-cache:

networks:
  carddemo-net:
    driver: bridge
