spring:
  application:
    name: billpay-backend
  # Default profile: H2 in DB2 compatibility mode. Hermetic for tests and local dev.
  # The same Flyway migrations run here and against real DB2 (profile: db2).
  datasource:
    url: jdbc:h2:mem:carddemo;MODE=DB2;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true

server:
  port: 8080

logging:
  level:
    org.flywaydb: INFO
