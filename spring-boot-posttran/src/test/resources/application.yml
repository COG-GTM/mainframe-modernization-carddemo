# Test configuration — uses H2 in-memory database
spring:
  application:
    name: carddemo-posttran-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

posttran:
  chunk-size: 5
  schedule:
    cron: "-"

logging:
  level:
    com.carddemo.posttran: DEBUG
    org.springframework.batch: DEBUG
