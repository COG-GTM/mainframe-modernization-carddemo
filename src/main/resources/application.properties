# ===================================================================
# CardDemo Batch Orchestration — Application Configuration
# Replaces JCL job scheduling with Spring Batch orchestration
# ===================================================================

spring.application.name=cardemo-batch-orchestration

# --- Database Configuration ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cardemo}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Spring Batch ---
# Disable auto-launch of jobs; jobs are triggered by scheduler or API
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus,batchjobs
management.endpoint.health.show-details=always
management.endpoint.batchjobs.enabled=true

# --- Batch Job Scheduling (cron expressions) ---
# POSTTRAN: Process daily transactions — default: daily at 2:00 AM
cardemo.batch.schedule.posttran.cron=0 0 2 * * *
# INTCALC: Compute interest — default: 1st of month at 3:00 AM
cardemo.batch.schedule.intcalc.cron=0 0 3 1 * *
# CREASTMT: Generate statements — default: 1st of month at 4:00 AM
cardemo.batch.schedule.creastmt.cron=0 0 4 1 * *
# Enable/disable job scheduling (default: false for safety)
cardemo.batch.schedule.enabled=false

# --- INTCALC PARM-DATE (optional, defaults to current date if empty) ---
cardemo.batch.intcalc.parm-date=

# --- GDG Output Directory ---
cardemo.batch.output.dir=./batch-output

# --- Logging ---
logging.level.com.cardemo.batch.orchestration=INFO
logging.level.org.springframework.batch=INFO
